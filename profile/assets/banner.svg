<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title description">
  <title id="title">Careti. Every visit counts.</title>
  <desc id="description">Digital loyalty for Tunisian businesses. A sample stamp card beside the Careti wordmark. Cards work with Apple Wallet and Google Wallet.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1521" />
      <stop offset="1" stop-color="#142b36" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b6ffdc" />
      <stop offset="1" stop-color="#50dcb4" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#a4e4d4" stroke-opacity=".06" />
    </pattern>
  </defs>
  <rect width="1280" height="360" rx="24" fill="url(#background)" />
  <rect width="1280" height="360" rx="24" fill="url(#grid)" />
  <circle cx="1080" cy="175" r="216" fill="none" stroke="#98efd2" stroke-opacity=".07" />
  <circle cx="1080" cy="175" r="176" fill="none" stroke="#98efd2" stroke-opacity=".1" />
  <rect x="72" y="70" width="28" height="4" rx="2" fill="#92f2cf" />
  <text x="72" y="108" fill="#a5bfc8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="3">DIGITAL LOYALTY FOR TUNISIAN BUSINESSES</text>
  <text x="67" y="202" fill="url(#accent)" font-family="Segoe UI, Arial, sans-serif" font-size="92" font-weight="700" letter-spacing="-5">Careti</text>
  <text x="73" y="248" fill="#e6f3f1" font-family="Segoe UI, Arial, sans-serif" font-size="28">Every visit counts.</text>
  <text x="73" y="284" fill="#a5bfc8" font-family="Segoe UI, Arial, sans-serif" font-size="16">Apple Wallet + Google Wallet</text>
  <g transform="translate(860 52) rotate(4 165 126)">
    <rect x="9" y="10" width="330" height="252" rx="22" fill="#020c13" fill-opacity=".35" />
    <rect width="330" height="252" rx="22" fill="#b6ffdc" />
    <path d="M0 84H330" stroke="#0b4436" stroke-opacity=".14" />
    <text x="24" y="41" fill="#0c392e" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700">Careti</text>
    <text x="25" y="66" fill="#326351" font-family="Segoe UI, Arial, sans-serif" font-size="12" letter-spacing="1">DIGITAL STAMP CARD</text>
    <g fill="#165640">
      <circle cx="57" cy="124" r="22" /><circle cx="129" cy="124" r="22" />
      <circle cx="201" cy="124" r="22" /><circle cx="273" cy="124" r="22" />
      <circle cx="57" cy="184" r="22" />
    </g>
    <g fill="none" stroke="#165640" stroke-opacity=".28" stroke-width="2" stroke-dasharray="3 4">
      <circle cx="129" cy="184" r="21" /><circle cx="201" cy="184" r="21" />
      <circle cx="273" cy="184" r="21" />
    </g>
    <g fill="none" stroke="#b6ffdc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="m49 124 6 6 11-12" /><path d="m121 124 6 6 11-12" />
      <path d="m193 124 6 6 11-12" /><path d="m265 124 6 6 11-12" />
      <path d="m49 184 6 6 11-12" />
    </g>
    <text x="25" y="232" fill="#326351" font-family="Segoe UI, Arial, sans-serif" font-size="12">A little closer to your next reward.</text>
  </g>
  <path d="M72 316H1208" stroke="#87ccb9" stroke-opacity=".16" />
  <text x="73" y="341" fill="#8faeb8" font-family="Segoe UI, Arial, sans-serif" font-size="11" letter-spacing="2">CARETI.TN</text>
